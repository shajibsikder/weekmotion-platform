services:
  # Weekmotion Unified Web Gateway & Media Processing Engine
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: weekmotion/gateway:latest
    container_name: weekmotion_gateway
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_NAME=weekmotion
      - REDIS_HOST=cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Relational Database Engine (MySQL with InnoDB ACID transactions)
  db:
    image: mysql:8.0
    container_name: weekmotion_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: weekmotion
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-wm_secure_vault_2026}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-Memory Cache and Real-Time Event Broker
  cache:
    image: redis:7-alpine
    container_name: weekmotion_cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
