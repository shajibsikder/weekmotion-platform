services:
  # Weekmotion Unified Web Gateway & Media Processing Engine
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: weekmotion/gateway:latest
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_NAME=weekmotion
      - DB_USER=weekmotion_app
      - DB_PASSWORD=${DB_PASSWORD:-wm_secret_db_pass}
      - REDIS_HOST=cache
      - REDIS_PASSWORD=${REDIS_PASSWORD:-wm_cache_secret}
    volumes:
      - upload_data:/var/www/html/upload
      - cache_data:/var/www/html/cache
    tmpfs:
      - /tmp:size=1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ && curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Relational Database Engine (MySQL 8.4 Long-Term Support)
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: weekmotion
      MYSQL_USER: weekmotion_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-wm_secret_db_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-wm_root_vault_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "weekmotion_app", "--password=${DB_PASSWORD:-wm_secret_db_pass}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # In-Memory Cache and Real-Time Event Broker
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-wm_cache_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-wm_cache_secret} ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  upload_data:
  cache_data:
  db_data:
  redis_data:
