services:
  # Weekmotion Unified Web Gateway & Media Processing Engine
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: weekmotion/gateway:latest
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_NAME=weekmotion
      - DB_USER=weekmotion_app
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=cache
    volumes:
      - upload_data:/var/www/html/upload
      - cache_data:/var/www/html/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Relational Database Engine (MySQL 8.4 Long-Term Support)
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: weekmotion
      MYSQL_USER: weekmotion_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-Memory Cache and Real-Time Event Broker
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-""}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  upload_data:
  cache_data:
  db_data:
  redis_data:
