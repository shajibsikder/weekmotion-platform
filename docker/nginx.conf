events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 500M;

    server {
        listen 80;
        server_name localhost;
        root /var/www/html;
        index index.php index.html;

        # Block dotfiles (.git, .env, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Block direct access to configuration and metadata files
        location ~* \.(env|git|yml|yaml|json|lock|md|conf|sql|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Restrict direct external access to legacy themes directory
        location ^~ /themes/ {
            return 404;
        }

        # Static build assets mapping (Weekmotion Build Pipeline)
        location ^~ /build/ {
            alias /var/www/html/themes/motion/;
            access_log off;
            expires 30d;
        }

        # Security: Prevent PHP execution inside user upload directories
        location ^~ /upload/ {
            location ~ \.php$ {
                deny all;
            }
        }

        # WebSocket Reverse Proxy for Real-Time Event Broker
        location /ws/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Clean routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM Handler with try_files guard
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }
    }
}
